name: Validate community components

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GIF generator
        run: python -m pip install -r requirements-assets.txt
      - name: Validate contributed manifests and assets
        run: python scripts/build_catalog.py
      - name: Confirm built-in GIF animations render
        run: python scripts/render_gifs.py
      - name: Check SVG generators and run offline Python tests
        run: |
          python -m py_compile scripts/render_dynamic.py scripts/render_showcase.py scripts/render_target.py
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Check browser scripts and Node layout tests
        run: |
          node --check src/main.js
          node --check src/designer.js
          node --check src/designer-core.mjs
          node --check src/repo-preview.mjs
          node --test tests/*.test.mjs
