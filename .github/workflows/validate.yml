name: Validate README Component Hub
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install animation dependencies
        run: python -m pip install -r requirements-assets.txt
      - name: Validate Neon Waveform catalog
        run: python scripts/build_catalog.py
      - name: Verify generated GIFs have real animation
        run: python scripts/render_gifs.py
      - name: Check browser JavaScript and tests
        run: |
          node --check src/neon-core.mjs
          node --check src/designer.js
          node --check src/main.js
          node --check src/hero.js
          node --check src/site.js
          node --check src/repo.js
          node --check src/composer.js
          node --test tests/*.test.mjs
