name: Validate community components

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GIF generator
        run: python -m pip install -r requirements-assets.txt
      - name: Validate contributed manifests and assets
        run: python scripts/build_catalog.py
      - name: Confirm built-in GIF animations render
        run: python scripts/render_gifs.py
      - name: Check browser JavaScript syntax
        run: node --check src/main.js
