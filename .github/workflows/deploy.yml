name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image dependencies
        run: python -m pip install -r requirements-assets.txt
      - name: Build single-component catalog
        run: python scripts/build_catalog.py
      - name: Generate animated GIFs
        run: python scripts/render_gifs.py
      - name: Validate Markdown and JavaScript
        run: |
          node --check src/neon-core.mjs
          node --check src/designer.js
          node --check src/main.js
          node --check src/hero.js
          node --check src/site.js
          node --check src/repo.js
          node --check src/composer.js
          node --test tests/*.test.mjs
      - name: Commit updated shared GIFs
        run: |
          git add -f generated/neon-wave/
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore: refresh Neon Waveform GIFs [skip ci]"
            git push origin HEAD:main
          fi
      - name: Package static site
        run: |
          mkdir -p dist
          cp index.html designer.html favicon.svg dist/
          cp -r src components generated dist/
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
