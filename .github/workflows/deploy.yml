name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Refresh GitHub repository data every hour (UTC). GitHub may delay runs.
    - cron: '17 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image dependencies
        run: python -m pip install -r requirements-assets.txt
      - name: Validate component manifests
        run: python scripts/build_catalog.py
      - name: Generate animated GIF assets
        run: python scripts/render_gifs.py
      - name: Generate GitHub repository stats cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/render_dynamic.py
      - name: Generate ten showcase components
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/render_showcase.py
      - name: Verify README generator and Markdown serialization
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.test.mjs
      - name: Commit generated README GIFs to repository
        run: |
          git add -f generated/
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore(assets): refresh README component images [skip ci]"
            git push origin HEAD:main
          else
            echo "Generated assets already match committed files."
          fi
      - name: Verify browser JavaScript syntax
        run: |
          node --check src/main.js
          node --check src/designer.js
          node --check src/designer-core.mjs
          node --check src/repo-preview.mjs
          node --check src/effects.js
      - name: Package static site
        run: |
          mkdir -p dist
          cp index.html designer.html favicon.svg dist/
          cp -r src components generated dist/
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
