name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image dependencies
        run: python -m pip install -r requirements-assets.txt
      - name: Validate component manifests
        run: python scripts/build_catalog.py
      - name: Generate animated GIF assets
        run: python scripts/render_gifs.py
      - name: Verify browser JavaScript syntax
        run: node --check src/main.js
      - name: Package static site
        run: |
          mkdir -p dist
          cp index.html favicon.svg dist/
          cp -r src components generated dist/
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
